# Pipeline config for 3d-pop_s.
#
# Resolves to configs/config_3d-pop_s.yaml.
#
# Prefer this over `litpose train` for real runs: make_model_cfg() replaces the
# epoch-based schedule with the step-based one below and forces
# predict_vids_after_training off, which is what the rest of the project's
# results were produced with.
#
# Generated by scripts/preprocess/pop3d_make_configs.py -- edit that, not this.

dataset_name: 3d-pop_s

lightning_pose_config: /teamspace/studios/this_studio/lp3d-analysis/configs/config_${dataset_name}.yaml

pipeline_seeds: 0

outputs_dir: /teamspace/studios/this_studio/outputs/${dataset_name}

intermediate_results_dir: crop_2.0

train_networks:
  run: True
  overwrite: False

  ensemble_seeds:
    - 0

  # training.train_frames counts ROWS (one per bird per time point; 2 or 5
  # birds each). 478 = every in-distribution row not held out for
  # validation (grouped split, seed 0: 478 train / 22 val of 500), the same
  # 'all available' rule used for the earlier SLP3D runs.
  n_hand_labels:
    - 478

  model_types:
    # heatmap_multiview_transformer + heatmap_cnn head, supervised, with the 3D
    # reprojection loss from cfg_lp.losses.
    - mvt_3d_loss

  # Empty: no videos exist for this dataset yet.
  inference_dirs: []

  min_steps: 5000
  max_steps: 5000
  unfreezing_step: 400
  milestone_steps: [2000, 3000, 4000]
  val_check_interval: 10
  train_check_interval: 5

# Everything below is off: ensembling and EKS need several trained seeds and, for
# the video modes, videos.
post_processing_labels:
  eks_singleview:
    run: False
    overwrite: False
  eks_multiview:
    run: False
    overwrite: False
    n_latent: 3
    non_linear: True
    output_folder_name: non_linear_eks_varinf
  ensemble_mean:
    run: False
    overwrite: False
  ensemble_median:
    run: False
    overwrite: False

post_processing_labeled_frames:
  run: False
  overwrite: False
  modes: null

post_processing_videos:
  eks_multiview:
    run: False
    overwrite: False
    n_latent: 3
    non_linear: True
    output_folder_name: non_linear_eks
  eks_singleview:
    run: False
    overwrite: False
  ensemble_median:
    run: False
    overwrite: False
  ensemble_mean:
    run: False
    overwrite: False

visualization:
  run: False
  overwrite: False
  ens_var_plots: False
  pixel_error_ens_std_plots:
    run: False
    overwrite: False
  eks_singleview_plots:
    run: False
    overwrite: False
