training:
  imgaug: dlc
  imagug_3d: true
  train_batch_size: 32
  val_batch_size: 48
  test_batch_size: 1
  train_prob: 0.98
  val_prob: 0.02
  train_frames: 1
  num_gpus: 1
  num_workers: 8
  early_stop_patience: 3
  unfreezing_epoch: 20
  min_epochs: 300
  max_epochs: 300
  log_every_n_steps: 10
  check_val_every_n_epoch: 5
  rng_seed_data_pt: 0
  rng_seed_model_pt: 0
  optimizer: Adam
  optimizer_params:
    learning_rate: 5.0e-05
  lr_scheduler: multisteplr
  lr_scheduler_params:
    multisteplr:
      milestones:
      - 2000
      - 3000
      - 4000
      gamma: 0.5
  uniform_heatmaps_for_nan_keypoints: true
  patch_mask:
    init_step: 4000
    final_step: 20000
    init_ratio: 0.1
    final_ratio: 0.5
model:
  losses_to_use: []
  backbone: vits_dino
  model_type: heatmap_multiview_transformer
  head: heatmap_cnn
  heatmap_loss_type: mse
  model_name: test_model
dali:
  general:
    seed: 123456
  base:
    train:
      sequence_length: 32
    predict:
      sequence_length: 64
  context:
    train:
      batch_size: 16
    predict:
      sequence_length: 96
losses:
  pca_multiview:
    log_weight: 5.0
    components_to_keep: 3
    epsilon: null
  pca_singleview:
    log_weight: 5.0
    components_to_keep: 0.99
    epsilon: null
  temporal:
    log_weight: 5.0
    epsilon: 20.0
    prob_threshold: 0.05
  supervised_reprojection_heatmap_mse:
    log_weight: 1.0
eval:
  predict_vids_after_training: true
  test_videos_directory: ${data.video_dir}
  save_vids_after_training: false
  colormap: cool
  confidence_thresh_for_vid: 0.9
  hydra_paths:
  - ' '
  fiftyone:
    dataset_name: test
    model_display_names:
    - test_model
    launch_app_from_script: false
    remote: true
    address: 127.0.0.1
    port: 5151
callbacks:
  anneal_weight:
    attr_name: total_unsupervised_importance
    init_val: 0.0
    increase_factor: 0.01
    final_val: 1.0
    freeze_until_epoch: 60
