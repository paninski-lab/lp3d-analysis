# 3d-pop_s
#
# One row per (time point, pigeon), identity carried by the session directory and
# stripped from the keypoint names. cfg.data.animal_names declares that, and
# keeps all birds (2 or 5) of a time point in the same train/val split.
#
# Generated by scripts/preprocess/pop3d_make_configs.py -- edit that, not this.
data:
  # resize dimensions to streamline model creation
  image_resize_dims:
    height: 256
    width: 256
  data_dir: /teamspace/studios/this_studio/data/3d-pop_s
  video_dir: /teamspace/studios/this_studio/data/3d-pop_s/videos
  # Per-row lookup from a label row to its camera calibration, matched
  # POSITIONALLY against the label rows. Always this dataset's own file: a config
  # that inherits another dataset's calibrations fails with a row-count mismatch.
  camera_params_file: /teamspace/studios/this_studio/data/3d-pop_s/calibrations.csv
  # In-distribution. Switch csv_file and bbox_file together to the *_new set for OOD.
  csv_file:
    - CollectedData_Cam1.csv
    - CollectedData_Cam2.csv
    - CollectedData_Cam3.csv
    - CollectedData_Cam4.csv
  # Each box in ORIGINAL full-frame pixels, row-aligned with csv_file. This is
  # what lets the model train on 320px crops while the 3D reprojection loss
  # works in full-frame coordinates.
  bbox_file:
    - bboxes_Cam1.csv
    - bboxes_Cam2.csv
    - bboxes_Cam3.csv
    - bboxes_Cam4.csv
  view_names:
    - Cam1
    - Cam2
    - Cam3
    - Cam4

  # downsample heatmaps - 2 | 3
  downsample_factor: 2
  num_keypoints: 9
  keypoint_names:
    - beak
    - nose
    - leftEye
    - rightEye
    - leftShoulder
    - rightShoulder
    - topKeel
    - bottomKeel
    - tail
  # Which suffix-or-infix token each row's session directory carries. Rows
  # sharing a frame are kept in the same train/val split.
  animal_names:
    - id47
    - id54
    - id382
    - id389
    - id391
    - id452
    - id473
    - id475
    - id483
    - id484
    - id485
    - id486
    - id487
    - id497
    - id705
    - id706
    - id707
    - id708

  # this info is only used for the multiview pca loss
  mirrored_column_matches: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  columns_for_singleview_pca: []

  skeleton:
    - ['beak', 'nose']
    - ['nose', 'leftEye']
    - ['nose', 'rightEye']
    - ['leftEye', 'rightEye']
    - ['leftShoulder', 'rightShoulder']
    - ['leftShoulder', 'topKeel']
    - ['rightShoulder', 'topKeel']
    - ['topKeel', 'bottomKeel']
    - ['bottomKeel', 'tail']

  skeleton_colors:
    beak-nose: red
    nose-leftEye: red
    nose-rightEye: red
    leftEye-rightEye: red
    leftShoulder-rightShoulder: dodgerblue
    leftShoulder-topKeel: dodgerblue
    rightShoulder-topKeel: dodgerblue
    topKeel-bottomKeel: darkred
    bottomKeel-tail: mediumseagreen

training:
  imgaug: dlc
  # Use the regular dlc augmentations even though camera params are present.
  imgaug_3d: True
  train_batch_size: 8
  val_batch_size: 16
  test_batch_size: 1
  train_prob: 0.95
  val_prob: 0.05
  # Overridden by the pipeline's n_hand_labels; see pipeline_3d-pop_s.yaml.
  train_frames: 1
  num_gpus: 1
  num_workers: 4
  early_stop_patience: 3
  unfreezing_epoch: 20
  # EPOCHS. Run through pipeline_simple.py these are replaced by the step-based
  # schedule in the pipeline config; standalone `litpose train` uses them as-is.
  min_epochs: 300
  max_epochs: 300
  log_every_n_steps: 10
  check_val_every_n_epoch: 5
  rng_seed_data_pt: 0
  rng_seed_model_pt: 0
  optimizer: Adam
  optimizer_params:
    learning_rate: 0.00005
  lr_scheduler: multisteplr
  lr_scheduler_params:
    multisteplr:
      milestones: [150, 200, 250]
      gamma: 0.5
  uniform_heatmaps_for_nan_keypoints: true

  # curriculum learning configuration for patch masking
  patch_mask:
    init_step: 700
    final_step: 5000
    init_ratio: 0.1
    final_ratio: 0.5

model:
  losses_to_use: []
  backbone: vits_dino
  model_type: heatmap_multiview_transformer
  head: heatmap_cnn
  heatmap_loss_type: mse
  model_name: 3d-pop_s

dali:
  general:
    seed: 123456
  base:
    train:
      sequence_length: 8
    predict:
      sequence_length: 16
  context:
    train:
      batch_size: 16
    predict:
      sequence_length: 96

losses:
  pca_multiview:
    log_weight: 5.0
    components_to_keep: 3
    epsilon: null
  pca_singleview:
    log_weight: 5.0
    components_to_keep: 0.99
    epsilon: null
  temporal:
    log_weight: 5.0
    epsilon: 20.0
    prob_threshold: 0.05
  # 3D reprojection loss. Constant weight -- not gated by AnnealWeight, which
  # only scales the *unsupervised* losses.
  supervised_reprojection_heatmap_mse:
    log_weight: 1.0

eval:
  # OFF: no cropped videos exist for this dataset. Leaving it on makes a run fail
  # at the very end, after the fit has already completed.
  predict_vids_after_training: false
  test_videos_directory: ${data.video_dir}
  save_vids_after_training: false
  colormap: "cool"
  confidence_thresh_for_vid: 0.90
  hydra_paths: [" "]
  fiftyone:
    dataset_name: test
    model_display_names: ["test_model"]
    launch_app_from_script: false
    remote: true
    address: 127.0.0.1
    port: 5151

callbacks:
  anneal_weight:
    attr_name: total_unsupervised_importance
    init_val: 0.0
    increase_factor: 0.01
    final_val: 1.0
    freeze_until_epoch: 60
